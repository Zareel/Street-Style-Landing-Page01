<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- font awsome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- tailwind css -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>StyleZ</title>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              poppins: ["Poppins", "sans-serif"],
              cursive: ["Dancing Script", "cursive"],
              orbitron: ["Orbitron", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <main class="h-screen">
      <nav class="h-20 flex items-center px-16 justify-between">
        <img src="./assets/logo.png" alt="logo" class="w-[100px] lg:w-[120px]" />
        <ul
          class="font-orbitron font-semibold text-lg text-gray-800 hidden lg:flex items-center gap-6 h-full"
        >
          <li class="font-bold text-xl underline">Home</li>
          <li>Male</li>
          <li>Female</li>
          <li>FAQ</li>
          <li>About</li>
        </ul>
        <div class="hidden lg:flex gap-3">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"

            />
          </svg>
          <button class="font-poppins border-2 border-black px-8 py-1 rounded-lg tracking-wider text-lg">Search</button>
        </div>
        <div class="lg:hidden">
          <i class="fa-brands fa-github text-2xl"></i>
          <i class="fa-solid fa-bars text-xl"></i>
        </div>
      </nav>
    </main>
  </body>
</html>
