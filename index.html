<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- font awsome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- tailwind css -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>StyleZ</title>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              poppins: ["Poppins", "sans-serif"],
              cursive: ["Dancing Script", "cursive"],
              orbitron: ["Orbitron", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <main class="h-screen">
      <nav class="h-20 flex items-center px-10 md:px-24 justify-between">
        <img
          src="./assets/logo.png"
          alt="logo"
          class="w-[100px] lg:w-[120px]"
        />
        <ul
          class="font-orbitron font-semibold text-lg text-gray-800 hidden lg:flex items-center gap-6 h-full"
        >
          <li class="font-bold text-xl underline">Home</li>
          <li>Male</li>
          <li>Female</li>
          <li>FAQ</li>
          <li>About</li>
        </ul>
        <div class="hidden lg:flex gap-3">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
            />
          </svg>
          <button
            class="font-poppins border-2 border-black px-8 py-1 rounded-lg tracking-wider text-lg"
          >
            Search
          </button>
        </div>
        <div class="lg:hidden">
          <i class="fa-brands fa-github text-2xl"></i>
          <i class="fa-solid fa-bars text-xl"></i>
        </div>
      </nav>
      <img src="./assets/globe.png" alt="globe" class="h-20 w-20 absolute left-1/2 top-28 hidden lg:flex">
      <img src="./assets/star.png" alt=" start" class="h-20 w-20 absolute right-36 top-36 hidden lg:flex">
      <section class="  px-5 md:px-10 lg:px-24 flex flex-col lg:flex-row gap-16 items-center">
        
        <!-- left -->
        <div class="w-[350px] w-1/3 relative flex">
          <img
            src="./assets/Image.png"
            alt="img"
            class="w-full h-full relative z-20"
          />
          <img
            src="./assets/squares.png"
            alt="img"
            class="hidden md:flex absolute top-44 left-20 w-[330px] z-10"
          />
        </div>
        <!-- right -->
        <div
          class="lg:w-2/3 h-auto md:pt-10 lg:h-[600px] flex flex-col items-center  font-bold justify-center"
        >
          <h1 class="font-orbitron text-4xl text-center md:text-5xl">What's Trend in 2026?</h1>
          <p
            class="font-poppins font-normal text-center text-sm lg:text-md text-gray-500 w-[350px]  lg:w-[600px] mt-4"
          >
            Lorem ipsum dolor sit amet consectetur adipisicing elit. ipsum
            inventore rerum adipisci suscipit cum! Nesciunt, id culpa? Deserunt
            labore debitis, voluptas quam vel harum aperiam? Voluptatem, optio
            vero.
          </p>
          <div class="font-orbitron mt-10 flex flex-col md:flex-row gap-6 md:gap-4">
            <button
              class="text-gray-600 text-lg tracking-wider border-2 border-black px-6 rounded-lg"
            >
              Email Address
            </button>
            <button class="bg-black text-white px-4 rounded-lg py-1">JOIN NOW</button>
          </div>
          <p class="font-poppins font-normal mt-6 md:mt-12 text-gray-500">Contact us</p>
          <div class="flex gap-2 mt-4 pb-10 lg:pb-0">
            <img src="./assets/Group.png" alt="">
            <img src="./assets/Group (1).png" alt="">
            <img src="./assets/Group (2).png" alt="">
            <img src="./assets/Group (3).png" alt="">
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
